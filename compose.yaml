services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: evaliq
      POSTGRES_DB: evaliq
      POSTGRES_PASSWORD: ${EVALIQ_PG_PASSWORD:?Set EVALIQ_PG_PASSWORD locally}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - evaliq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaliq -d evaliq"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  evaliq_pg:
